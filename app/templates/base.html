<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{% block title %}Proxy NLE{% endblock %}</title>
    <link rel="stylesheet" href="/static/css/app.css" />
  </head>
  <body>
    {% block body %}{% endblock %}
    {% block footer %}
    <footer class="statusbar" id="statusbar">
      <span>CPU <b id="stat-cpu">—</b></span>
      <span>RAM <b id="stat-ram">—</b></span>
      <span>Disk <b id="stat-disk">—</b></span>
      <span>Net <b id="stat-net">—</b></span>
    </footer>
    {% endblock %}
    <script src="/static/js/app.js"></script>
  </body>
</html>
